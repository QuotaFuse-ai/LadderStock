# 增量同步与冷热分离（文档 §6.2 + DEC-006）
#
# 每个数据集必须能在 core/boundary.py 的 DATASET_CATALOG 找到生态归属；
# 这里只写「用哪几个 source id（见 sources.yaml）」与增量模式。
# 主源失败 → 同 peer 备源 → 本地缓存回放；不启用任何自建采集。

sync:
  datasets:
    # 逐只取数的数据集（tencent_kline / stock_fund_flow / dragon_tiger_seats 的 code 必填）
    # 需要一个**代码池**。解析优先级（QUOT-233）：
    #   1. 本次命令行 `ldst sync --codes 600000,000001`
    #   2. 下面这份 `codes`
    #   3. 本机隐私库自选表 watchlist（只读代码；对外输出只出现数量）
    # 三处都为空 → 该数据集判 failed 且**一次调用都不发**：空 `code` 会被 TickHub 拒回
    # QFSD-9001，历史上这里发的是空参，才把整包压成 1 行、日期取成抓取时间。
    # 单次上限 100 只（超过请分批判 --codes；全市场口径是盘后包备源，不在这里硬顶）。
    daily_k:
      primary: tickhub_kline
      fallback: [tickhub_tdx_package]
      watermark_field: trade_date
      mode: append
      codes: []

    limit_pool:
      primary: tickhub_limit_pool
      fallback: [tickhub_ths_limit_pool]
      watermark_field: trade_date
      mode: replace

    broken_board:
      primary: tickhub_broken_board
      fallback: []
      watermark_field: trade_date
      mode: replace

    yesterday_limit_up:
      primary: tickhub_yesterday_limit
      fallback: []
      watermark_field: trade_date
      mode: replace

    sentiment:
      primary: tickhub_sentiment
      fallback: []
      watermark_field: trade_date
      mode: replace

    dragon_tiger:
      primary: tickhub_dragon_tiger
      fallback: [tickhub_dragon_tiger_backup]
      watermark_field: trade_date
      mode: replace

    dragon_tiger_seats:
      primary: tickhub_seats
      fallback: []
      watermark_field: trade_date
      mode: replace
      codes: []

    industry_board:
      primary: tickhub_industry
      fallback: []
      watermark_field: trade_date
      mode: replace

    concept_board:
      primary: tickhub_concept
      fallback: []
      watermark_field: trade_date
      mode: replace

    fund_flow:
      primary: tickhub_fund_flow
      fallback: []
      watermark_field: trade_date
      mode: replace
      codes: []

    # ---- R5 产业研究（QUOT-143）----
    # 前三只按代码池逐只取数：成分表是**懒缓存**（DEC-018），只同步用得到的代码，
    # 不做全市场全量构建；代码池优先级同 daily_k（--codes > 这里 > 本机自选）。
    sw_industry_map:
      primary: tickhub_sw_map
      fallback: []
      watermark_field: trade_date
      mode: append
      codes: []

    finance_indicators:
      primary: tickhub_finance_indicators
      fallback: []
      watermark_field: trade_date
      mode: append
      codes: []

    valuation_history:
      primary: tickhub_valuation_history
      fallback: []
      watermark_field: trade_date
      mode: append
      codes: []

    # 板块资金流：按日整批替换，board_type=industry 是登记在册的口径入参（不是猜默认值）
    industry_fund_flow:
      primary: tickhub_industry_fund_flow
      fallback: []
      watermark_field: trade_date
      mode: replace

    hot_rank:
      primary: tickhub_hot_rank
      fallback: [tickhub_hot_rank_em]
      watermark_field: trade_date
      mode: replace

    # ---------------- 资讯雷达（R6 / QUOT-144）----------------
    # 全部 `optional: true`：资讯是「按需按时间窗」的（`ldst news`），
    # 定时增量只是顺带归档。取不到只记 skipped，不把整轮 sync 的退出码拖成 8/4。
    # 三个 code 必填的栏目（巨潮 / 深交所 / 东财个股新闻）在裸 `ldst sync` 里
    # 必然被 peer 拒（上游要求 code），这是预期行为，不是链路故障。
    announcement_cninfo:
      primary: tickhub_announce_cninfo
      fallback: [tickhub_announce_cninfo_backup]
      watermark_field: data_as_of
      mode: append
      optional: true

    announcement_szse:
      primary: tickhub_announce_szse
      fallback: [tickhub_announce_szse_backup]
      watermark_field: data_as_of
      mode: append
      optional: true

    research_report:
      primary: tickhub_research_report
      fallback: [tickhub_research_report_sina]
      watermark_field: data_as_of
      mode: append
      optional: true

    news_eastmoney_stock:
      primary: tickhub_news_stock
      fallback: []
      watermark_field: data_as_of
      mode: append
      optional: true

    news_cctv:
      primary: tickhub_news_cctv
      fallback: []
      watermark_field: data_as_of
      mode: append
      optional: true

    flash_cls:
      primary: tickhub_flash_cls
      fallback: []
      watermark_field: data_as_of
      mode: append
      optional: true

    flash_wallstreetcn:
      primary: tickhub_flash_wsc
      fallback: []
      watermark_field: data_as_of
      mode: append
      optional: true

    flash_eastmoney:
      primary: tickhub_flash_em
      fallback: []
      watermark_field: data_as_of
      mode: append
      optional: true

    lockup_calendar:
      primary: tickhub_lockup_calendar
      fallback: []
      watermark_field: trade_date
      mode: replace
      optional: true

    earnings_preview:
      primary: tickhub_earnings_preview
      fallback: []
      watermark_field: notice_date
      mode: replace
      optional: true

    # 可选：未安装 Wire 时整段跳过，题材段降级为纯指标叙述
    theme_news:
      primary: wire_digest
      fallback: [wire_timeline]
      watermark_field: data_as_of
      mode: replace
      optional: true

    # 可选：只读拉取 Senate 已有报告，不发起合议
    council_memo:
      primary: senate_reports
      fallback: []
      watermark_field: data_as_of
      mode: replace
      optional: true

  cold_hot:
    intraday_cache_ttl_sec: 60
    history_backend: duckdb
