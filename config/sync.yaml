# 增量同步与冷热分离（文档 §6.2 + DEC-006）
#
# 每个数据集必须能在 core/boundary.py 的 DATASET_CATALOG 找到生态归属；
# 这里只写「用哪几个 source id（见 sources.yaml）」与增量模式。
# 主源失败 → 同 peer 备源 → 本地缓存回放；不启用任何自建采集。

sync:
  datasets:
    # 逐只取数的数据集（tencent_kline / stock_fund_flow / dragon_tiger_seats 的 code 必填）
    # 需要一个**代码池**。解析优先级（QUOT-233）：
    #   1. 本次命令行 `ldst sync --codes 600000,000001`
    #   2. 下面这份 `codes`
    #   3. 本机隐私库自选表 watchlist（只读代码；对外输出只出现数量）
    # 三处都为空 → 该数据集判 failed 且**一次调用都不发**：空 `code` 会被 TickHub 拒回
    # QFSD-9001，历史上这里发的是空参，才把整包压成 1 行、日期取成抓取时间。
    # 单次上限 100 只（超过请分批判 --codes；全市场口径是盘后包备源，不在这里硬顶）。
    daily_k:
      primary: tickhub_kline
      fallback: [tickhub_tdx_package]
      watermark_field: trade_date
      mode: append
      codes: []

    limit_pool:
      primary: tickhub_limit_pool
      fallback: [tickhub_ths_limit_pool]
      watermark_field: trade_date
      mode: replace

    broken_board:
      primary: tickhub_broken_board
      fallback: []
      watermark_field: trade_date
      mode: replace

    yesterday_limit_up:
      primary: tickhub_yesterday_limit
      fallback: []
      watermark_field: trade_date
      mode: replace

    sentiment:
      primary: tickhub_sentiment
      fallback: []
      watermark_field: trade_date
      mode: replace

    dragon_tiger:
      primary: tickhub_dragon_tiger
      fallback: [tickhub_dragon_tiger_backup]
      watermark_field: trade_date
      mode: replace

    dragon_tiger_seats:
      primary: tickhub_seats
      fallback: []
      watermark_field: trade_date
      mode: replace
      codes: []

    industry_board:
      primary: tickhub_industry
      fallback: []
      watermark_field: trade_date
      mode: replace

    concept_board:
      primary: tickhub_concept
      fallback: []
      watermark_field: trade_date
      mode: replace

    # 个股↔概念板块归属（QUOT-362，题材分项的正式输入）：逐只 `stock_concept_blocks`
    # 快照，**代码池来自当日涨停池归档**（`codes_from`），不扩全市场。
    # 必须排在 `limit_pool` 之后：同一轮 `ldst sync` 里读到的才是今天刚落的池子。
    # `watermark_field: timestamp` 只表「取数时刻」，不是交易日水位（上游 TTL 60 秒，
    # 没有 `since` 入参，每次都整批替换）——口径同 `_b("spot_quote", ...)`。
    # `optional: true`：今天没有涨停池（休市/取数失败）时判 skipped 而不是 failed。
    #
    # 当日实时资金流（QUOT-371）：**一次批量调用取完整代码池**，不走逐只扇出。
    # 与日线 `fund_flow` 双口径并存：这条给打榜「资金」分项的当日实时值，
    # 日线那条留着做历史对比，两者不互相顶替（DEC-049）。
    # 水位用 `timestamp`（取数时刻），盘中每轮整批替换；与 `spot_quote` 同一形状。
    fund_flow_realtime:
      primary: tickhub_fund_flow_batch
      fallback: []
      watermark_field: timestamp
      mode: replace
      codes: []
      codes_from: limit_pool
      optional: true

    concept_membership:
      primary: tickhub_concept_membership
      fallback: []
      watermark_field: timestamp
      mode: replace
      optional: true
      codes_from: limit_pool

    fund_flow:
      primary: tickhub_fund_flow
      fallback: []
      watermark_field: trade_date
      mode: replace
      codes: []

    # ---- R5 产业研究（QUOT-143）----
    # 前三只按代码池逐只取数：成分表是**懒缓存**（DEC-018），只同步用得到的代码，
    # 不做全市场全量构建；代码池优先级同 daily_k（--codes > 这里 > 本机自选）。
    sw_industry_map:
      primary: tickhub_sw_map
      fallback: []
      watermark_field: trade_date
      mode: append
      codes: []

    finance_indicators:
      primary: tickhub_finance_indicators
      fallback: []
      watermark_field: trade_date
      mode: append
      codes: []

    valuation_history:
      primary: tickhub_valuation_history
      fallback: []
      watermark_field: trade_date
      mode: append
      codes: []

    # 板块资金流：按日整批替换，board_type=industry 是登记在册的口径入参（不是猜默认值）
    industry_fund_flow:
      primary: tickhub_industry_fund_flow
      fallback: []
      watermark_field: trade_date
      mode: replace

    hot_rank:
      primary: tickhub_hot_rank
      fallback: [tickhub_hot_rank_em]
      watermark_field: trade_date
      mode: replace

    # ---------------- 资讯雷达（R6 / QUOT-144）----------------
    # 全部 `optional: true`：资讯是「按需按时间窗」的（`ldst news`），
    # 定时增量只是顺带归档。取不到只记 skipped，不把整轮 sync 的退出码拖成 8/4。
    # 三个 code 必填的栏目（巨潮 / 深交所 / 东财个股新闻）在裸 `ldst sync` 里
    # 必然被 peer 拒（上游要求 code），这是预期行为，不是链路故障。
    announcement_cninfo:
      primary: tickhub_announce_cninfo
      fallback: [tickhub_announce_cninfo_backup]
      watermark_field: data_as_of
      mode: append
      optional: true

    announcement_szse:
      primary: tickhub_announce_szse
      fallback: [tickhub_announce_szse_backup]
      watermark_field: data_as_of
      mode: append
      optional: true

    research_report:
      primary: tickhub_research_report
      fallback: [tickhub_research_report_sina]
      watermark_field: data_as_of
      mode: append
      optional: true

    news_eastmoney_stock:
      primary: tickhub_news_stock
      fallback: []
      watermark_field: data_as_of
      mode: append
      optional: true

    news_cctv:
      primary: tickhub_news_cctv
      fallback: []
      watermark_field: data_as_of
      mode: append
      optional: true

    flash_cls:
      primary: tickhub_flash_cls
      fallback: []
      watermark_field: data_as_of
      mode: append
      optional: true

    flash_wallstreetcn:
      primary: tickhub_flash_wsc
      fallback: []
      watermark_field: data_as_of
      mode: append
      optional: true

    flash_eastmoney:
      primary: tickhub_flash_em
      fallback: []
      watermark_field: data_as_of
      mode: append
      optional: true

    lockup_calendar:
      primary: tickhub_lockup_calendar
      fallback: []
      watermark_field: trade_date
      mode: replace
      optional: true

    earnings_preview:
      primary: tickhub_earnings_preview
      fallback: []
      watermark_field: notice_date
      mode: replace
      optional: true

    # 可选：未安装 Wire 时整段跳过，题材段降级为纯指标叙述
    #
    # `topics` 是**赛道池**（QUOT-328）：`wire_get_digest` 的 `topic` 必填、只认 Wire 的
    # 赛道 slug（`config/topics.yaml` 的 `id`），一次调用只覆盖一个赛道，所以逐个取数。
    # 中文赛道名（`半导体`）上游直接判「未知赛道」，别往这里写。
    # `fallback: []` 是**显式声明**「这条链只有主源」，不是漏写：`chain()` 认显式空值，
    # 不会回填 `sources.yaml` 的 fallback。那里 `wire_timeline` 仍作为同 peer 备源登记着
    # （DEC-006 合规），但它要的是 `event_id`（单事件下钻），按日摘要没有事件维度，
    # 挂进链路等于备源永远和主源一起报错——所以挡在链路外、留给按事件调用（DEC-043）。
    theme_news:
      primary: wire_digest
      fallback: []
      watermark_field: data_as_of
      mode: replace
      optional: true
      topics:
        - ai
        - semiconductor
        - robotics
        - automotive
        - energy
        - biotech
        - aerospace
        - cybersecurity
        - tech
        - consumer
        - macro
        - science

    # 可选：只读拉取 Senate 已有报告，不发起合议
    council_memo:
      primary: senate_reports
      fallback: []
      watermark_field: data_as_of
      mode: replace
      optional: true

  cold_hot:
    intraday_cache_ttl_sec: 60
    history_backend: duckdb

  # ---- 上游限流退避（QFSD-7001，QUOT-349 / DEC-048）----
  # 命中标 `rate_limited` 的返回时，链路内按上游给的 `retry_after_s` 等，等得起才重试。
  # 预算是**一次取数**共享的（链路里主备工具用同一份），不是每个工具各来一遍：
  # 盘中高频轮询（QUOT-345 范围 2，30–60s 一轮）不能被一次限流拖住整轮。
  # 次数用完 / 建议时长超过 `max_wait_sec` → 不再等，照旧走备源 → 本地昨日池回放。
  rate_limit:
    max_retries: 2
    max_wait_sec: 15
    max_cooldown_sec: 900
