# 数据源与主备顺序（文档 §6.1 + DEC-006 四层边界）
#
# 硬约束：本文件只描述「向哪个生态 peer 的哪个工具取数」，不描述行情供应商。
# - 每个 source 必须有 via（tickhub / wire / senate）与 tool（该 peer 的工具名）。
# - 不允许出现采集库、行情站点域名或第三方数据商；越界由
#   src/ladderstock/core/boundary.py 与 tests/contract/test_ecosystem_boundary.py 拦截。
# - 备源只能是**同一个 peer 的另一个工具**；peer 整体不可用时降级为缓存回放，
#   绝不启用自建采集（文档第九节禁区）。

# peers 块是生态 peer 注册表的**唯一真源**（QUOT-403）：core/boundary.py 的
# PEERS 由此生成，控制面面板的模块卡、ldst doctor 的 peer 行都跟着走。
# 字段口径：
#   health_path  —— 该 peer 真实提供的健康检查路径（探测用，不许在代码里写死 /healthz）
#   default_port —— 该 peer 的主服务端口（MCP 或 HTTP；与 boundary.Peer.default_port 一致）
#   role         —— 模块卡上显示的一句话职责
#   repo         —— GitHub 仓库名（owner/name），QUOT-402 版本三态检测的期望版本来源
peers:
  tickhub:
    product: TickHub-CN
    package: tickhub-cn
    cli: th-cn
    mcp_name: tickhub-cn
    url_env: LDST_TICKHUB_MCP_URL
    default_url: http://127.0.0.1:8000/mcp
    timeout_sec: 10
    health_path: /healthz
    default_port: 8000
    role: 数据底座：行情 / 涨停池 / 龙虎榜 / 情绪指标 / 资金
    repo: QuotaFuse-ai/TickHub-CN
  # TickHub-US：8001 被 WSL 转发服务占用、admin 8787 与 CN 撞车，
  # 故 MCP 走 8002、admin 走 8789（DEC-013 / DEC-014 §3）。
  tickhub_us:
    product: TickHub-US
    package: tickhub-us
    cli: th-us
    mcp_name: tickhub-us
    url_env: LDST_TICKHUB_US_MCP_URL
    default_url: http://127.0.0.1:8002/mcp
    timeout_sec: 10
    health_path: /healthz
    default_port: 8002
    role: 数据底座：美股行情 / 财报 / 监管披露
    repo: QuotaFuse-ai/TickHub-US
  wire:
    product: QuotaFuse Wire
    package: quotafuse-wire
    cli: qfw
    mcp_name: qf-wire
    url_env: LDST_WIRE_MCP_URL
    default_url: http://127.0.0.1:8791/mcp
    timeout_sec: 15
    health_path: /api/health
    default_port: 8790
    role: 资讯感知：新闻 / 政策 / 产业链 / 多源聚合
    repo: QuotaFuse-ai/quotafuse-wire
  senate:
    product: StockSenate
    package: stocksenate
    cli: ssenate
    mcp_name: stock-senate
    url_env: LDST_SENATE_MCP_URL
    default_url: http://127.0.0.1:8765/mcp
    timeout_sec: 20
    health_path: /healthz
    default_port: 8765
    role: 投研合议：7 分析师 → 辩论 → 风控 → 终审 / 回测
    repo: QuotaFuse-ai/StockSenate
  # FinanceCoffer（QUOT-403）：数据存储，不是取数通道——sources 不允许 via 它，
  # 只登记注册表让控制面出第 5 张卡。服务跑在 WSL（8100），控制面只读观测不接管启停；
  # /health 回 status=degraded（如 embedding unreachable）时面板如实显示，不是故障。
  financecoffer:
    product: FinanceCoffer
    package: financecoffer
    cli: fc
    mcp_name: null            # FC 当前没有 MCP 面，写 null，探测走 HTTP
    url_env: LDST_FINANCECOFFER_URL
    default_url: http://127.0.0.1:8100
    timeout_sec: 10
    health_path: /health
    default_port: 8100
    role: 数据存储：结构化宽表 / 公告检索 / 风险
    repo: QuotaFuse-ai/FinanceCoffer
  # mem0（QUOT-486）：LadderStock 助手的记忆后端，同 FinanceCoffer 口径——不是取数
  # 通道，sources 不允许 via 它，只登记注册表让控制面出卡。服务是 WSL 里的
  # docker compose（project qf-mem0，端口 9100/3200/8532），与 Multica 的 mem0-dev
  # 物理隔离；控制面托管启停（compose 分支），不查 import/不装 wheel。
  # /configure 是实测确认的健康端点（server 无 /healthz）。
  mem0:
    product: Mem0
    package: qf-mem0
    cli: docker               # 占位：实际启停是 WSL docker compose（PEER_CONTROL.compose_file），cli 不执行
    mcp_name: null            # 没有 MCP 面，9100 是 REST API
    url_env: LDST_MEM0_API_URL
    default_url: http://127.0.0.1:9100
    timeout_sec: 10
    health_path: /configure
    default_port: 9100
    role: 助手记忆：add / search / 历史回放（本地 bge-small-zh 向量，云骏 LLM）
    repo: null
  # ProxyFleet（QUOT-485）：生态基础设施（出口代理池），从「工具组件只读观测」
  # 升级为纳管 peer——但同 FinanceCoffer / mem0 口径：不是取数通道，sources 不允许
  # via 它，DATASET_CATALOG 不给它任何数据集，四层边界的保护点不变。
  # 服务是 Windows 计划任务 ProxyFleet（SYSTEM）带起的 `python -m proxyfleet serve`：
  # 控制面启停走该垫片任务（PEER_CONTROL.task_name），账本记 origin=spawned-via-task；
  # 8788 既是控制台/REST 也是 LS 视角的 MCP 面（ProxyFleet 自带 stdio MCP 就是这个
  # REST 的客户端），8789 是出口网关（PEER_CONTROL.extra_ports，只探测不出「打开」）。
  proxyfleet:
    product: ProxyFleet
    package: proxyfleet
    cli: pfctl                # 占位：实际启停是 Windows 计划任务 ProxyFleet（PEER_CONTROL.task_name），cli 不执行
    mcp_name: null            # 面板不直连它的 MCP；LS 侧走本仓 mcp 的 proxyfleet_* 工具（薄封装 8788 REST）
    url_env: LDST_PROXYFLEET_API_URL
    default_url: http://127.0.0.1:8788
    timeout_sec: 10
    health_path: /readyz      # 实测确认：免鉴权健康端点，ready = biz_ok >= 1
    default_port: 8788
    role: 代理池：节点采集 / 健康检查 / 出口网关（8788 控制台 · 8789 网关）
    repo: null
  # qdrant（QUOT-488）：标的档案知识库的向量层，同 mem0 口径——不是取数通道，
  # sources 不允许 via 它，只登记注册表让控制面出卡。两个容器（project qf-qdrant）：
  # qdrant REST/Dashboard 6333、mcp-server-qdrant streamable-http 9300，主机侧均绑
  # 127.0.0.1。独立卷存储，不复用 mem0 的 pgvector；控制面托管启停（compose 分支）。
  # /collections 是实测确认的健康端点（Qdrant 无 /healthz）。
  qdrant:
    product: Qdrant
    package: qf-qdrant
    cli: docker               # 占位：实际启停是 WSL docker compose（PEER_CONTROL.compose_file），cli 不执行
    mcp_name: null            # MCP 面是 mcp-server-qdrant（9300，streamable-http），不经 sources 注册
    url_env: LDST_QDRANT_API_URL
    default_url: http://127.0.0.1:6333
    timeout_sec: 10
    health_path: /collections
    default_port: 6333
    role: 知识库向量层：档案向量存储 / 语义检索（REST 6333 · MCP 9300）

sources:
  # ---------------- 行情与短线数据：TickHub-CN ----------------
  - id: tickhub_kline
    dataset: daily_k
    via: tickhub
    tool: tencent_kline
    primary: true
    fallback: [tickhub_tdx_package]
    timeout_sec: 10
    retries: 2
    cooldown_sec: 60
    weight: 1.0

  # K 线图端点（QUOT-410）：与 `tickhub_kline` 同一工具，但 period / adjust 是
  # **运行时参数**（请求透传，三档周期 × 三档复权），不能挂 sync 的写死口径，
  # 所以是独立数据集 `kline_chart` 的独立登记。不进 sync.yaml、不落库。
  # 无备源：`tdx_daily_package` 是日线全市场包，不收 period / adjust，挂了必败
  # （同 peer 无第二个支持周 / 月 / 复权的 K 线工具，DEC-006 主备同口径）。
  - id: tickhub_kline_chart
    dataset: kline_chart
    via: tickhub
    tool: tencent_kline
    primary: true
    fallback: []
    timeout_sec: 10
    retries: 2
    cooldown_sec: 60
    weight: 1.0

  - id: tickhub_tdx_package
    dataset: daily_k
    via: tickhub
    tool: tdx_daily_package
    primary: false
    fallback: []
    timeout_sec: 30
    retries: 1
    cooldown_sec: 120
    weight: 0.8

  - id: tickhub_limit_pool
    dataset: limit_pool
    via: tickhub
    tool: limit_up_pool
    primary: true
    fallback: [tickhub_ths_limit_pool]
    timeout_sec: 10
    retries: 2
    cooldown_sec: 60
    weight: 1.0

  - id: tickhub_ths_limit_pool
