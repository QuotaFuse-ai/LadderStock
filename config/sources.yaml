    cooldown_sec: 120
    weight: 1.0

  # ---------------- 财报前瞻 / 事件回看（QUOT-446）----------------
  # 五个事件/一致预期工具，全部是 TickHub-CN 已注册的只读工具（实测 2026-11-05）：
  # earnings_forecast 6 条 / holder_trades 125 条 / institution_survey 0 条（真实空）/
  # share_buyback 0 条（真实空）/ ths_eps_forecast 快照 / lockup_expiry history+upcoming。
  # 无备源：同 peer 没有第二种口径的同类工具（DEC-006 主备同口径），取不到就按
  # 缓存回放处理，不自建采集。
  - id: tickhub_consensus_forecast
    dataset: consensus_forecast
    via: tickhub
    tool: ths_eps_forecast
    primary: true
    fallback: []
    timeout_sec: 15
    retries: 1
    cooldown_sec: 300
    weight: 1.0

