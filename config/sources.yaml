    via: tickhub
    tool: ths_limit_up_pool
    primary: false
    fallback: []
    timeout_sec: 10
    retries: 2
    cooldown_sec: 60
    weight: 0.9

  - id: tickhub_broken_board
    dataset: broken_board
    via: tickhub
    tool: broken_board_pool
    primary: true
    fallback: []
    timeout_sec: 10
    retries: 2
    cooldown_sec: 60
    weight: 1.0

  - id: tickhub_yesterday_limit
    dataset: yesterday_limit_up
    via: tickhub
    tool: yesterday_limit_up_pool
    primary: true
    fallback: []
    timeout_sec: 10
    retries: 2
    cooldown_sec: 60
    weight: 1.0

  - id: tickhub_sentiment
    dataset: sentiment
    via: tickhub
    tool: market_sentiment
    primary: true
    fallback: []
    timeout_sec: 10
    retries: 2
    cooldown_sec: 60
    weight: 1.0

  # 盘中 6 时点快照（QUOT-286）：实时报价只给 `schedule` 的 kind=snapshot 用，
  # **不进 sync.yaml / 不进台账**（机器存的盘面读数 vs 用户自己记的东西分开）。
  # 无备源：同 peer 没有第二个批量报价工具；取不到就按 status=missing 记，不补跑。
  - id: tickhub_spot_quote
    dataset: spot_quote
    via: tickhub
    tool: tencent_quote_batch
    primary: true
    fallback: []
    timeout_sec: 10
    retries: 2
    cooldown_sec: 60
    weight: 1.0

  # 首页指数条（QUOT-380）：与 `spot_quote` 同构的实时报价——**不进 sync.yaml / 不进台账**，
  # 非交易时段 peer 照旧回上一交易日收盘（`as_of` 如实带出），不需要日更。
  # 无备源：同 peer 的 `index_list` 是「按涨幅排序的 100 条榜」（实测不含这四个指数、
  # 还混老三板个股），`index_kline` 是历史 K 线，都不是同一口径的换源（DEC-006 主备同口径）。
  - id: tickhub_index_quote
    dataset: index_quote
    via: tickhub
    tool: index_quote
    primary: true
    fallback: []
    timeout_sec: 10
    retries: 2
    cooldown_sec: 60
    weight: 1.0

  # 首页指数条的美股 2 格（QUOT-471）：TickHub-US 的 `th_us_get_quote` 逐 symbol 取
  # （`DJI` / `IXIC`，一次一个），与 `spot_quote` 同构——**不进 sync.yaml / 不进台账**。
  # 无备源：同 peer 的 `th_us_get_market_data` 是指数 K 线（不是同一口径的换源），
  # 且恒指 / 恒生科技在该 peer 上对 `HSI.HK` 等写法一律 `isError`（DEC-006 主备同口径）。
  # `commercial_use` 由调用方显式带（非商用），合规分级随回包落进 `source_detail`。
  - id: tickhub_us_index_quote
    dataset: index_quote_us
    via: tickhub_us
    tool: th_us_get_quote
    primary: true
    fallback: []
    timeout_sec: 10
    retries: 2
    cooldown_sec: 60
    weight: 1.0

  # 首页指数条的港股 2 格（QUOT-560）：同一工具 `th_us_get_quote` 逐 symbol 取
  # （`HSI.HK` / `HSTECH.HK`，peer 端 ticker 规范化后行键带 `.HK` 后缀），
  # 与 `index_quote_us` 同构——**不进 sync.yaml / 不进台账**。零 key（腾讯/新浪公开源），
  # `commercial_use` 由调用方显式带（非商用），合规分级随回包落进 `source_detail`。
  - id: tickhub_hk_index_quote
    dataset: index_quote_hk
    via: tickhub_us
    tool: th_us_get_quote
    primary: true
    fallback: []
    timeout_sec: 10
