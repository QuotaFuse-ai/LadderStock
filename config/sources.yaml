# 数据源与主备顺序（文档 §6.1 + DEC-006 四层边界）
#
# 硬约束：本文件只描述「向哪个生态 peer 的哪个工具取数」，不描述行情供应商。
# - 每个 source 必须有 via（tickhub / wire / senate）与 tool（该 peer 的工具名）。
# - 不允许出现采集库、行情站点域名或第三方数据商；越界由
#   src/ladderstock/core/boundary.py 与 tests/contract/test_ecosystem_boundary.py 拦截。
# - 备源只能是**同一个 peer 的另一个工具**；peer 整体不可用时降级为缓存回放，
#   绝不启用自建采集（文档第九节禁区）。

peers:
  tickhub:
    product: TickHub-CN
    package: tickhub-cn
    cli: th-cn
    mcp_name: tickhub-cn
    url_env: LDST_TICKHUB_MCP_URL
    default_url: http://127.0.0.1:8000/mcp
    timeout_sec: 10
  # TickHub-US：8001 被 WSL 转发服务占用、admin 8787 与 CN 撞车，
  # 故 MCP 走 8002、admin 走 8789（DEC-013 / DEC-014 §3）。
  tickhub_us:
    product: TickHub-US
    package: tickhub-us
    cli: th-us
    mcp_name: tickhub-us
    url_env: LDST_TICKHUB_US_MCP_URL
    default_url: http://127.0.0.1:8002/mcp
    timeout_sec: 10
  wire:
    product: QuotaFuse Wire
    package: quotafuse-wire
    cli: qfw
    mcp_name: qf-wire
    url_env: LDST_WIRE_MCP_URL
    default_url: http://127.0.0.1:8791/mcp
    timeout_sec: 15
  senate:
    product: StockSenate
    package: stocksenate
    cli: ssenate
    mcp_name: stock-senate
    url_env: LDST_SENATE_MCP_URL
    default_url: http://127.0.0.1:8765/mcp
    timeout_sec: 20

