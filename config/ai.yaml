# AI 编排（文档 §6.3 / QUOT-236 多后端）
# 密钥不落配置文件：每个后端只声明环境变量名，值从环境变量读取。
# 过渡期旧写法（顶层 base_url_env / api_key_env + 裸模型名）仍可读，
# 等价于一个隐式 openai 后端；新配置推荐 backends[] + `backend:model` 链。
ai:
  backends:
    - id: openai
      type: openai
      base_url_env: LDST_LLM_BASE_URL
      api_key_env: LDST_LLM_API_KEY
      models: [user-model, model-a, model-b]
    - id: anthropic
      type: anthropic
      base_url_env: LDST_LLM_ANTHROPIC_BASE_URL
      api_key_env: LDST_LLM_ANTHROPIC_API_KEY
      models: [claude-sonnet-4-5]
  default_model: openai:user-model
  fallback_chain: [openai:model-a, openai:model-b, anthropic:claude-sonnet-4-5]
  structured_output: prefer
  on_all_failed: degrade_to_text
  sections:
    sentiment:
      prompt_file: prompts/sentiment.md
      output_schema: SentimentSection
    capital:
      prompt_file: prompts/capital.md
      output_schema: CapitalSection
    theme:
      prompt_file: prompts/theme.md
      output_schema: ThemeSection
    dragon_tiger:
      prompt_file: prompts/dragon_tiger.md
      output_schema: DragonTigerSection
    leader:
      prompt_file: prompts/leader.md
      output_schema: LeaderSection
