# 申万一级行业清单（R5 产业研究，QUOT-143）
#
# 口径（DEC-018）：**行业归属以申万一级为准**，资金流的板块口径单独标注，两套不混算。
#
# - `l1_code`：申万行业分类表的一级代码（6 位，前 2 位一级 + `0000`），
#   与 TickHub-CN `sw_industry_history` 返回的 `l1_code` 同格式，直接对得上。
#   上游只发布代码、不发布「代码 → 名称」快照（`sw_industry.py` 的 note 写明了这一点），
#   所以名称与代码的绑定由**锚点股**建立：每个行业取 2 只无歧义的龙头股，
#   2026-10-31 经 TickHub-CN `sw_industry_history` 实测，**两只回同一 l1_code 才写进本表**；
#   两只不一致（说明锚点选错或归属有争议）的行业，`l1_code` 一律留 `null`，
#   该行业的成分派生维度按「显式 null + unverified」输出，不猜码。
# - `board_name`：板块口径资金流的同名板块绑定（仅供「板块口径」那一段字段使用）。
#   同名不等于同成分——这一段字段永远标自己的 caliber（东财 BK / 新浪行业，
#   取自缓存记录的实际 `source`），绝不冒充申万口径，也绝不与申万口径的字段相加。
# - `enabled: false` 即从子集里裁掉该行业（任务要求「配置可裁剪子集」）。
# - 本文件是**数据**，不是计算口径：公式与缺失策略一律见
#   `docs/specs/SPEC-INDUSTRY-METRICS.md`。

industry:
  version: 1
  membership_caliber: sw_l1
  provenance:
    bound_via: tickhub_sw_industry_history_anchor
    retrieved_at: "2026-10-31T06:20:00+08:00"
    source: swsresearch
    note: 锚点归属由生态 peer TickHub-CN 只读工具实测，名称标签为人工指定，待上游「全市场申万分类快照」就绪后改为数据直取

  window:
    fund_days: 5 # 近 N 个交易日主力净流入（个股口径累加）
    valuation_lookback_days: 250 # PE / PB 分位的历史窗口（交易日）
    turnover_lookback_days: 60 # 换手分位的历史窗口（交易日）
    momentum_windows: [5, 20] # 动量回看窗口（交易日）

