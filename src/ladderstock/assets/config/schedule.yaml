# 定时任务表：只调度本机任务（DEC-006）——不新增采集、不直连行情站点、不写凭据。
# 时间均为 scheduler.timezone 下的本地时间（HH:MM）。本文件由
# config/schema/schedule.schema.json 校验，`ldst config validate` 会一并检查。
scheduler:
  timezone: Asia/Shanghai
  misfire_grace_seconds: 300

jobs:
  # 07:30 题材资讯每日采集（QUOT-554）：先触发 Wire peer 自己的 `qfw run`（采集+提炼，
  # QF_WIRE_API_KEY 由 Wire 从它自己的 .env 加载，不经本表/日志），再走既有 theme_news
  # 同步链路（wire_get_digest 按赛道扇出）落 DuckDB/Parquet 并推进水位——打开即新鲜，
  # 零手动 sync。每天跑（含周末，资讯不收盘）；部分免费 RSS 源 403/不可用只记 degraded，
  # 不补造、不拿旧数据顶替。幂等：replace 整日覆盖 + qfw run 同日重跑只覆盖当日；
  # 失败可手动补跑 `ldst schedule run --once --job wire_news_daily`。
  - id: wire_news_daily
    name: 07:30 题材资讯采集
    kind: wire_news
    trigger: "07:30"
    enabled: true
  # 09:05 盘前摘要（QUOT-432 / DEC-058）：按真实行情生成「自选 + 持仓」的现价 / 昨收 /
  # 涨跌，写完 inbox 再投递本机通知。旧 `premarket_reminder`（静态口播文案）退役——
  # 自己的配置里若还留着 `kind: notify` 的它，照常生效（notify 类型没删）。
  - id: premarket_digest
    name: 09:05 盘前摘要
    kind: digest
    summary: premarket
    trigger: "09:05"
    enabled: true
    channel: console
  # 盘中 6 时点快照（QUOT-286）：只读 peer 的 `spot_quote` / 昨日涨停池 / 情绪，
  # 落 `data/intraday/<date>/<HHMM>.json`（只创建不覆盖），窗口外记 skipped 不补跑。
  - id: snapshot_0925
    name: 09:25 竞价快照
    kind: snapshot
    trigger: "09:25"
    enabled: true
  - id: snapshot_0935
    name: 09:35 开盘快照
    kind: snapshot
    trigger: "09:35"
    enabled: true
  - id: snapshot_1000
    name: 10:00 盘中快照
    kind: snapshot
    trigger: "10:00"
    enabled: true
  - id: snapshot_1130
    name: 11:30 午盘快照
    kind: snapshot
    trigger: "11:30"
    enabled: true
  - id: snapshot_1400
    name: 14:00 午后快照
    kind: snapshot
    trigger: "14:00"
    enabled: true
  - id: snapshot_1500
    name: 15:00 收盘快照
    kind: snapshot
    trigger: "15:00"
    enabled: true
  # 盘中高频关键快照（QUOT-352 / DEC-056）：交易日连续竞价时段（09:30–11:30、
  # 13:00–15:00）每 30 秒抓一次「昨日涨停股 × 此刻报价」，落
  # `data/intraday/<date>/fast/<HHMMSS>.json`（与 6 个定点时点分开，互不覆盖），
  # 每轮一行观测记录进 `fast/rounds.jsonl`。只读 TickHub 缓存、不直打上游（DEC-006），
  # 限流退避复用 S2 的适配器（QUOT-349）。时段外一律 skipped，不落盘。
  - id: intraday_fast
    name: 盘中 30s 关键快照
    kind: snapshot_fast
    trigger: "30s"
    enabled: true
  # 盘中资金流批量（QUOT-352）：同样只在连续竞价时段跑，60 秒一轮调
  # `stock_fund_flow_batch`（一次覆盖整个涨停池），结果照 DEC-054 落
  # `data/intraday/<date>/fund_flow_realtime/<HHMM>.json`，看板资金时点随之更新。
  # 选 60s 而不是 30s：批量工具走东财 push2，端点闸门 3 次/60s，60s 已是
  # 「每轮都出网」的上限节拍；把 30s 让给更便宜的报价批（腾讯源 180 次/60s）。
  - id: fund_flow_fast
    name: 盘中 60s 资金流批量
    kind: sync_batch
    trigger: "60s"
    enabled: true
    dataset: fund_flow_realtime
  - id: close_reconcile
    name: 15:05 收盘对账
    kind: reconcile
    trigger: "15:05"
    enabled: true
  # 15:35 收盘全量同步（QUOT-347）：复用 `ldst sync` 链路顺序拉候选池数据集
  # （limit_pool / fund_flow / concept_board，一切取数走 TickHub 缓存、不直打上游 DEC-006），
  # 落 `archive/YYYY/MM/DD/<dataset>.parquet` 日分区，再触发当日 `ldst review`。
  # 仅交易日动作，非交易日整轮 skipped；单任务失败只记 degraded/failed，不影响 15:05 对账。
  # 幂等由 duckdb_store 兜底（replace 整日覆盖、append 按 (code,trade_date) upsert）。
  - id: close_sync
    name: 15:35 收盘全量同步
    kind: sync_close
    trigger: "15:35"
    enabled: true
  # 15:40 收盘摘要（QUOT-432 / DEC-058）：持仓当日盈亏（close(T) − close(T−1) 口径）、
  # 自选涨跌榜、当日已实现 / 分红。只读本机 daily_k 与 portfolio_trades，不联网。
  - id: close_digest
    name: 15:40 收盘摘要
    kind: digest
    summary: close
    trigger: "15:40"
    enabled: true
    channel: console
  # 16:15 自选变化（QUOT-432 / DEC-058）：自选与上一交易日的收盘价 / 成交量变化。
  # 本机只有一天缓存时明确写「没有上一交易日可比」，不编。
  - id: watch_changes
    name: 16:15 自选变化
    kind: digest
    summary: watch
    trigger: "16:15"
    enabled: true
    channel: console
  # 16:30 自选/持仓档案刷新（QUOT-568）：收盘数据落齐（15:35 同步）之后，对自选 ∪ 持仓
  # 的每只票跑一次六段研究，产物只经既有 `store.archive_run()` 出口落 `data/knowledge/`
  # （run 非 failed 才落盘；跑挂的票记原因，不编档案）。产出「有档案票数 / 关注票数」
  # 覆盖率，低于阈值记一条收件箱问题项并走自愈同款桌面通知；任务可在 `ldst schedule list`
  # 看到、`enabled: false` 关掉。可加 `daily_limit: N` 限制每轮最多刷几只。
  - id: knowledge_refresh
    name: 16:30 自选/持仓档案刷新
    kind: knowledge_refresh
    trigger: "16:30"
    enabled: true
