# 定时任务表：只调度本机任务（DEC-006）——不新增采集、不直连行情站点、不写凭据。
# 时间均为 scheduler.timezone 下的本地时间（HH:MM）。本文件由
# config/schema/schedule.schema.json 校验，`ldst config validate` 会一并检查。
scheduler:
  timezone: Asia/Shanghai
  misfire_grace_seconds: 300

jobs:
  # 07:30 题材资讯每日采集（QUOT-554）：先触发 Wire peer 自己的 `qfw run`（采集+提炼，
  # QF_WIRE_API_KEY 由 Wire 从它自己的 .env 加载，不经本表/日志），再走既有 theme_news
  # 同步链路（wire_get_digest 按赛道扇出）落 DuckDB/Parquet 并推进水位——打开即新鲜，
  # 零手动 sync。每天跑（含周末，资讯不收盘）；部分免费 RSS 源 403/不可用只记 degraded，
  # 不补造、不拿旧数据顶替。幂等：replace 整日覆盖 + qfw run 同日重跑只覆盖当日；
  # 失败可手动补跑 `ldst schedule run --once --job wire_news_daily`。
  - id: wire_news_daily
    name: 07:30 题材资讯采集
    kind: wire_news
    trigger: "07:30"
    enabled: true
  # 07:45 公告 / 研报 / 快讯批量采集（新增）：公告类栏目（announcement_cninfo /
  # announcement_szse）上游要求 code 必填，批量入口必须按代码池分批传（默认每批 100 只），
  # 否则每轮都是 skipped、一条公告都进不来。采集后同时落 news.sqlite 与 data/archive。
  # 现在 **enabled: false**：先只接代码、不真采（IP / 上游额度还没定），
  # 打开只需把下面改成 true，或 `ldst schedule run --once --job news_radar`。
  #
  # `candidate_filter: true`：公告两源只查「池 ∪ 当日异动」（news/candidates.py）。
  # 上游对公告是逐票 HTTP，池 85 只 = 85 次/轮，池 300 就是 300 次——最容易触发
  # 限流/封 IP 的地方。筛掉的是"池内非异动票"，不是缺口：覆盖率分母仍按
  # 池 ∪ 池外异动算（并集），未采的票在 /config 显式标"按策略未采"。
  # 没有本机行情快照时会自动回退全池（前置筛不会把采集变成 0 只）。
  - id: news_radar
    name: 07:45 公告/研报/快讯批量采集
    kind: news_collect
    trigger: "07:45"
    enabled: false
    datasets: announcement_cninfo,announcement_szse,research_report,flash_cls,flash_wallstreetcn,flash_eastmoney
    batch_size: 100
    limit: 100
    candidate_filter: true
  # 09:05 盘前摘要（QUOT-432 / DEC-058）：按真实行情生成「自选 + 持仓」的现价 / 昨收 /
  # 涨跌，写完 inbox 再投递本机通知。旧 `premarket_reminder`（静态口播文案）退役——
  # 自己的配置里若还留着 `kind: notify` 的它，照常生效（notify 类型没删）。
  - id: premarket_digest
    name: 09:05 盘前摘要
    kind: digest
    summary: premarket
    trigger: "09:05"
    enabled: true
    channel: console
  # 09:10 晨报（F11）：把盘前行情 + 池内外异动 + 公告采集状态 + 今日日程 + 研究产物
  # 拼成**一份**简报（≤5 条），条目按内容指纹去重后落收件箱。
  # `notify` 缺省跟随 `config/brief.yaml`（默认 false，只落收件箱不弹窗）。
  - id: brief_morning
    name: 09:10 晨报
    kind: brief
    summary: morning
    trigger: "09:10"
    enabled: true
  # 15:45 收盘复盘（F11）：收盘盈亏 + 持仓/自选异动 + 今日研究产物 + 已排任务。
  # 排在 15:40 收盘摘要之后，复用那份摘要，不重复算一遍盈亏。
  - id: brief_close
    name: 15:45 收盘复盘简报
    kind: brief
    summary: close_review
    trigger: "15:45"
    enabled: true
  # 15:50 持仓异动（F11）：只出超过阈值的持仓/自选；没有异动就 skipped，不发空简报。
  - id: brief_alerts
    name: 15:50 持仓异动简报
    kind: brief
    summary: position_alerts
    trigger: "15:50"
    enabled: true
  # 盘中 6 时点快照（QUOT-286）：只读 peer 的 `spot_quote` / 昨日涨停池 / 情绪，
  # 落 `data/intraday/<date>/<HHMM>.json`（只创建不覆盖），窗口外记 skipped 不补跑。
  - id: snapshot_0925
    name: 09:25 竞价快照
    kind: snapshot
    trigger: "09:25"
    enabled: true
  - id: snapshot_0935
    name: 09:35 开盘快照
    kind: snapshot
    trigger: "09:35"
    enabled: true
  - id: snapshot_1000
    name: 10:00 盘中快照
    kind: snapshot
    trigger: "10:00"
    enabled: true
  - id: snapshot_1130
    name: 11:30 午盘快照
    kind: snapshot
    trigger: "11:30"
    enabled: true
  - id: snapshot_1400
    name: 14:00 午后快照
    kind: snapshot
    trigger: "14:00"
    enabled: true
  - id: snapshot_1500
    name: 15:00 收盘快照
    kind: snapshot
    trigger: "15:00"
    enabled: true
  # 盘中高频关键快照（QUOT-352 / DEC-056）：交易日连续竞价时段（09:30–11:30、
  # 13:00–15:00）每 30 秒抓一次「昨日涨停股 × 此刻报价」，落
  # `data/intraday/<date>/fast/<HHMMSS>.json`（与 6 个定点时点分开，互不覆盖），
  # 每轮一行观测记录进 `fast/rounds.jsonl`。只读 TickHub 缓存、不直打上游（DEC-006），
  # 限流退避复用 S2 的适配器（QUOT-349）。时段外一律 skipped，不落盘。
  - id: intraday_fast
    name: 盘中 30s 关键快照
    kind: snapshot_fast
    trigger: "30s"
    enabled: true
  # 盘中资金流批量（QUOT-352）：同样只在连续竞价时段跑，60 秒一轮调
  # `stock_fund_flow_batch`（一次覆盖整个涨停池），结果照 DEC-054 落
  # `data/intraday/<date>/fund_flow_realtime/<HHMM>.json`，看板资金时点随之更新。
  # 选 60s 而不是 30s：批量工具走东财 push2，端点闸门 3 次/60s，60s 已是
  # 「每轮都出网」的上限节拍；把 30s 让给更便宜的报价批（腾讯源 180 次/60s）。
  - id: fund_flow_fast
    name: 盘中 60s 资金流批量
    kind: sync_batch
    trigger: "60s"
    enabled: true
    dataset: fund_flow_realtime
  - id: close_reconcile
    name: 15:05 收盘对账
    kind: reconcile
    trigger: "15:05"
    enabled: true
  # 15:35 收盘全量同步（QUOT-347）：复用 `ldst sync` 链路顺序拉候选池数据集
  # （limit_pool / fund_flow / concept_board，一切取数走 TickHub 缓存、不直打上游 DEC-006），
  # 落 `archive/YYYY/MM/DD/<dataset>.parquet` 日分区，再触发当日 `ldst review`。
  # 仅交易日动作，非交易日整轮 skipped；单任务失败只记 degraded/failed，不影响 15:05 对账。
  # 幂等由 duckdb_store 兜底（replace 整日覆盖、append 按 (code,trade_date) upsert）。
  - id: close_sync
    name: 15:35 收盘全量同步
    kind: sync_close
    trigger: "15:35"
    enabled: true
  # 18:30 晚间补取（龙虎榜）：交易所按规则**收盘后**才公布龙虎榜（通常 18:00 之后），
  # 15:35 的收盘同步必然拿不到。这条在 18:30 再来一趟，取到就落当日分区；取不到只记
  # degraded 并说清原因，不补造、不拿上一天顶替。没有它，复盘页龙虎榜那一段整晚都只能
  # 显示「还没公布」，得用户自己去跑 sync。
  - id: dragon_tiger_evening
    name: 18:30 龙虎榜晚间补取
    kind: sync_evening
    datasets: "dragon_tiger,dragon_tiger_seats"
    trigger: "18:30"
    enabled: true
  # 15:40 收盘摘要（QUOT-432 / DEC-058）：持仓当日盈亏（close(T) − close(T−1) 口径）、
  # 自选涨跌榜、当日已实现 / 分红。只读本机 daily_k 与 portfolio_trades，不联网。
  - id: close_digest
    name: 15:40 收盘摘要
    kind: digest
    summary: close
    trigger: "15:40"
    enabled: true
    channel: console
  # 16:15 自选变化（QUOT-432 / DEC-058）：自选与上一交易日的收盘价 / 成交量变化。
  # 本机只有一天缓存时明确写「没有上一交易日可比」，不编。
  - id: watch_changes
    name: 16:15 自选变化
    kind: digest
    summary: watch
    trigger: "16:15"
    enabled: true
    channel: console
  # 16:30 自选/持仓档案刷新（QUOT-568）：收盘数据落齐（15:35 同步）之后，对自选 ∪ 持仓
  # 的每只票跑一次六段研究，产物只经既有 `store.archive_run()` 出口落 `data/knowledge/`
  # （run 非 failed 才落盘；跑挂的票记原因，不编档案）。产出「有档案票数 / 关注票数」
  # 覆盖率，低于阈值记一条收件箱问题项并走自愈同款桌面通知；任务可在 `ldst schedule list`
  # 看到、`enabled: false` 关掉。可加 `daily_limit: N` 限制每轮最多刷几只。
  - id: knowledge_refresh
    name: 16:30 自选/持仓档案刷新
    kind: knowledge_refresh
    trigger: "16:30"
    enabled: true

  # 08:45 盯盘提醒（第④步）：自选在本机报价快照里涨跌幅越过 `alert_pct` 就写收件箱 +
  # 投通知。数据只读 `symbol_basic`（不联网）；快照日期不是当天时，正文会标出数据日期，
  # 不冒充分时实时价。默认关闭：先确认字典的日常刷新节奏，再决定是否每天开盘前打开。
  - id: watch_alert_morning
    name: 08:45 盯盘提醒
    kind: watch_alert
    alert_pct: 5
    trigger: "08:45"
    enabled: true
    channel: desktop
  # 16:40 定时研究（第④步）：把这一轮研究交给 agent——模型自己选工具、自己定轮次，
  # 产物落 `data/research_digest/<date>/<job>.json` 与收件箱。默认关闭：一轮会真实调用
  # 模型，确认额度与问题文本后再打开。`symbols` 留空 = 一轮市场视角，给代码 = 逐只问。
  - id: agent_research_close
    name: 16:40 定时研究（收盘后）
    kind: agent_research
    question: 今天自选与持仓的表现、资金面和消息面有什么值得注意的？只用工具取到的数据分析。
    symbols: []
    trigger: "16:40"
    enabled: true
    channel: desktop

  # 16:55 跨轮任务推进（`ai/plans.py`）：把用户亲口交待过的长期目标（「盯住浦发一周」
  # 「半导体板块持续看」）按各自频率各跑一轮，结论落 research_digest 与收件箱。
  # 没有到期任务时按 skipped 静默返回，不写告警日志。与 16:40 那条的区别：那条是表里
  # 写死的问题，这条问的是用户自己的目标，并且会跟上次比「有没有变化」。
  - id: plan_tick_close
    name: 16:55 跨轮任务推进
    kind: plan_tick
    trigger: "16:55"
    enabled: true
    # 推进这一轮的回答**不允许**再建新任务：推进提问本身带「持续跟踪 600000…」，
    # 允许就会每推进一步繁殖一条同标任务，五天把上限打满。只有确实需要在推进里续建
    # 任务时才改 true。
    allow_plan_create: false
    channel: desktop

  # 盘中 30 秒实时盯盘（第④步）：只在交易时段（09:30–11:30 / 13:00–15:00）现取实时报价，
  # 越过阈值就写收件箱 + 投通知。与 08:45 那条的区别是**数据口径**：这条拿的是此刻的价，
  # 不是缓存里那一天的收盘。同一只票 `min_gap_min` 分钟内只响一次，避免 30 秒刷屏。
  # `auto_research` 是「条件触发」：命中阈值后自动把这几只票交给 agent 跑一轮研究
  # （最多 2 只、同票 60 分钟冷却），结论落 research_digest 与收件箱，不用等人来问。
  - id: watch_live_intraday
    name: 盘中 30s 实时盯盘
    kind: watch_live
    alert_pct: 3
    move_pct: 1
    min_gap_min: 30
    auto_research: true
    auto_research_max: 2
    auto_research_cooldown_min: 60
    trigger: "30s"
    enabled: true
    channel: desktop

  # 盘中实时情绪快照（60s）：`limit_up_pool` 只给最近一个已收盘交易日，15:35 之前
  # 当天没有涨停池归档，情绪温度页只能靠这一刻的实时读数。`market_sentiment` 在盘中
  # 给的是当日涨停 / 炸板 / 跌停家数与最高连板、龙头名单，这条任务把它钉到
  # `data/live/sentiment/<date>.json`（只写 live 目录，不碰 archive、不推水位）。
  # 收盘 15:35 的 `close_sync` 落了当日归档后，页面自动切回归档口径。
  - id: sentiment_live
    name: 盘中实时情绪快照
    kind: sentiment_live
    trigger: "60s"
    enabled: true

  # 16:10 到期观点回访（F9）：扫一遍观点账本，把到期记录拉日线判对错并回写。
  # 缺行情的记录留 open 等下一轮；周末/休市没有到期记录时按 ok 返回（无告警）。
  # 与 `/api/assistant/recall` 手动入口走同一个 run_recall，口径一致。
  - id: recall_due
    name: 16:10 观点回访判定
    kind: recall
    trigger: "16:10"
    enabled: true

  # 提醒引擎终检（DEC-087）：把用户自配规则（价格 / 均线 / 放量 / 浮盈亏）按
  # **收盘价**再判一遍，命中即收件箱 + 出站渠道。与 `ldst alert run` 和
  # `POST /api/alert/run` 是同一个执行体。
  # 盘中高频巡检把 trigger 改成间隔形态（如 "300s"）即可；引擎按「越线报一次」
  # 自我去重，不会因为高频跑而刷屏。
  - id: alert_close
    name: 15:05 收盘提醒终检
    kind: alert_check
    trigger: "15:05"
    enabled: false
