# 回测成本与阈值默认值（QUOT-500 / 规格 §5.3）
#
# 本文件是回测默认值**唯一**来源：代码里的兜底只为「配置目录被搬走」兜底，
# 运行卡会明确记录每个字段的实际来源（yaml / cli / fallback）。
# CLI 覆盖：ldst backtest run --commission 0.0003 --slippage 0.001 --stamp-duty 0.001 ...
#
# 严格校验：任何字段缺失、负数、为 0 的成本、切分比例不在 (0, 1) 内、
# 成本档位未按升序排列，都会直接报错退出（EXIT_CONFIG），不会回落到默认值。
#
# 顶层只有 `costs` / `gate` 两段（字段路径见 backtest/config.py 的 FIELD_YAML_PATH）。

costs:
  # 佣金率（万 2.5，按成交额，双边）；插值类型：小数（0.00025 = 万 2.5）
  commission: 0.00025
  # 滑点率（千 1，按成交价）；买 +滑、卖 −滑；不得为 0
  slippage: 0.001
  # 卖出印花税（千 1，只对卖出成交额收）；不得为 0
  stamp_duty: 0.001
  # 成本敏感性三档：在默认佣金额上下取高/中/低各一档，看结论是否翻转（滑点与印花税不动）
  # 顺序必须是从小到大；档位数量 >= 2
  tiers: [0.0002, 0.0005, 0.001]

gate:
  # 校验门最小完整交易次数：低于此值即使收益好看也标红
  min_trades: 20
  # 样本切分：前 N 样本内 / 后 (1-N) 样本外；必须按时间顺序，不许随机
  in_sample_ratio: 0.7
