name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同仓 PR 门禁用仓库内置 GITHUB_TOKEN，不需要任何 secret（QUOT-238 决定②）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest / ruff / mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[all,dev]"

      - name: pytest
        run: python -m pytest -o addopts=""

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy

  frontend:
    name: frontend (tsc / vitest / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run

      - name: build
        run: npx vite build
