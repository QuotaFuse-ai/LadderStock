[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ladderstock"
version = "0.1.0.dev0"
description = "天梯股复盘台 · A 股短线复盘与跟踪工作台（LadderStock）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "QuotaFuse" }]
keywords = ["a-share", "review", "mcp", "local-first", "trading-journal"]

dependencies = [
  "pydantic>=2.6,<3",
  # 钉死 0.28.0：0.29.0 起 TyperOption 不再暴露 `.type`，test_cli_output_option
  # 的 introspection（param.type.choices）全崩（QUOT-532，见 DEC-072）。
  "typer==0.28.0",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.20,<5",
  "duckdb>=1.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<3"]
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
pdf = ["reportlab>=4.0,<6", "fonttools>=4.50,<5"]
schedule = ["apscheduler>=3.10,<4"]
all = ["ladderstock[mcp,web,pdf,schedule]"]
dev = ["pytest>=8.0,<10", "ruff>=0.5,<1", "mypy>=1.10,<3"]

[project.scripts]
ldst = "ladderstock.cli.main:main"
ladderstock = "ladderstock.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 内部过程材料按 DEC-0026 只留本地、不进版本管理；留在工作副本里也不参与静态检查，
# 否则 `ruff check .` 会被复核脚本的行长等噪声卡住（QUOT-206）。
# ProxyFleet 是独立子模块（有自己的仓库与 lint 配置），不参与本仓静态检查。
extend-exclude = ["docs/tasks", "qa_evidence", "tmp*", "ProxyFleet"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml.*", "jsonschema.*"]
ignore_missing_imports = true

# `ctypes.windll` 只在 Windows 存在（typeshed 也只给 win32 平台定义），
# 但 posix 平台检查时该行会报 attr-defined、win 平台检查时 ignore 又判「未使用」，
# 平台二选一都挂一头——此模块只允许平台相关的 ignore（mypy 官方对平台特定代码的建议）。
[[tool.mypy.overrides]]
module = ["ladderstock.supervisor.restart"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
