[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ladderstock"
version = "0.1.0.dev0"
description = "天梯股复盘台 · A 股短线复盘与跟踪工作台（LadderStock）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "QuotaFuse" }]
keywords = ["a-share", "review", "mcp", "local-first", "trading-journal"]

dependencies = [
  "pydantic>=2.6,<3",
  "typer>=0.12,<1",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.20,<5",
  "duckdb>=1.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<3"]
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
pdf = ["reportlab>=4.0,<6", "fonttools>=4.50,<5"]
all = ["ladderstock[mcp,web,pdf]"]
dev = ["pytest>=8.0,<10", "ruff>=0.5,<1", "mypy>=1.10,<3"]

[project.scripts]
ldst = "ladderstock.cli.main:main"
ladderstock = "ladderstock.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 内部过程材料按 DEC-0026 只留本地、不进版本管理；留在工作副本里也不参与静态检查，
# 否则 `ruff check .` 会被复核脚本的行长等噪声卡住（QUOT-206）。
extend-exclude = ["docs/tasks", "qa_evidence", "tmp*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
